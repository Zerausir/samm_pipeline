x-airflow-common:
  &airflow-common
  # Cambiamos la imagen por nuestra imagen personalizada
  # Necesitarás construir esta imagen primero con: docker build -f Dockerfile.airflow -t custom-airflow:2.7.3 .
  image: custom-airflow:2.7.3
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: 'America/New_York'
    # 🔧 NUEVAS CONFIGURACIONES DE TIMEOUT PARA TAREAS LARGAS
    AIRFLOW__CORE__TASK_TIMEOUT: 900                    # 15 minutos timeout para tareas
    AIRFLOW__CORE__KILLED_TASK_CLEANUP_TIME: 300       # 5 minutos para cleanup
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: 300          # 5 minutos para import de DAGs
    AIRFLOW__CORE__TASK_RUNNER: StandardTaskRunner     # Runner más estable
    AIRFLOW__CELERY__TASK_TIMEOUT: 600                 # 10 minutos para Celery (si aplica)
    # 🔧 CONFIGURACIONES DE BASE DE DATOS MEJORADAS
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: 10       # Aumentar pool size
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_RECYCLE: 3600  # Reciclar conexiones cada hora
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_PRE_PING: 'true' # Verificar conexiones antes de usar
    PYTHONPATH: '/opt/airflow'
    POSTGRES_HOST: ${POSTGRES_HOST}
    POSTGRES_PORT: ${POSTGRES_PORT}
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./app:/opt/airflow/app
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
      # 🔧 CONFIGURACIONES MEJORADAS DE POSTGRESQL
      POSTGRES_SHARED_PRELOAD_LIBRARIES: 'pg_stat_statements'
      POSTGRES_MAX_CONNECTIONS: 200              # Aumentar conexiones máximas
      POSTGRES_SHARED_BUFFERS: 256MB            # Aumentar buffer compartido
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB        # Optimizar cache
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      # 🔧 CONFIGURACIÓN POSTGRESQL PERSONALIZADA
      - ./postgres-conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "airflow" ]
      interval: 5s
      retries: 5
      # 🔧 TIMEOUT MÁS LARGO PARA HEALTHCHECK
      timeout: 30s
    restart: always
    ports:
      - 5432:5432

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - 8080:8080
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 30s          # 🔧 INTERVALOS MÁS LARGOS
      timeout: 30s           # 🔧 TIMEOUT MÁS LARGO
      retries: 3             # 🔧 MENOS REINTENTOS
      start_period: 60s      # 🔧 PERÍODO DE INICIO MÁS LARGO
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: [ "CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"' ]
      interval: 30s          # 🔧 INTERVALOS MÁS LARGOS
      timeout: 30s           # 🔧 TIMEOUT MÁS LARGO
      retries: 3             # 🔧 MENOS REINTENTOS
      start_period: 60s      # 🔧 PERÍODO DE INICIO MÁS LARGO
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        function ver() {
          printf "%04d%04d%04d%04d" $${1//[^0-9]/ }
        }
        airflow_version=$$(AIRFLOW__LOGGING__LOGGING_LEVEL=INFO && gosu airflow airflow version)
        airflow_version_comparable=$$(ver $${airflow_version})
        min_airflow_version=2.2.0
        min_airflow_version_comparable=$$(ver $${min_airflow_version})
        if (( airflow_version_comparable < min_airflow_version_comparable )); then
          echo
          echo -e "\033[1;31mERROR!!!: Too old Airflow version $${airflow_version}!\e[0m"
          echo "The minimum Airflow version supported: $${min_airflow_version}. Only use this or higher!"
          echo
          exit 1
        fi
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        disk_available=$$(($${disk_available} / one_meg))
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
        fi
        if (( disk_available < 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GiB recommended. You have $$(numfmt --to iec $$((disk_available * one_meg)))"
          echo
        fi
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R "${AIRFLOW_UID}:0" /sources/{logs,dags,plugins}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD}
    user: "0:0"
    volumes:
      - ./airflow:/sources

  # Contenedor para ejecutar procesamiento de datos externo
  data-processor:
    image: python:3.11
    volumes:
      - ./app:/app
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}    # 🔧 MANTENEMOS TU CONFIGURACIÓN ORIGINAL
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    working_dir: /app
    command: >
      bash -c "pip install psycopg2-binary geopandas pyodbc environs openpyxl pykml pandas shapely numpy sqlalchemy pyarrow &&
              sleep infinity"
    depends_on:
      - postgres

